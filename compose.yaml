services:
  backend:
    build:
      context: ./backend
    container_name: etl-stats-backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      - ./refs:/app/refs
    environment:
      - STATS_API_TOKEN=${STATS_API_TOKEN}
      - DATABASE_URL=sqlite:////app/data/etl_stats.db
      - CORS_ORIGINS=*
      - RCON_HOST=${RCON_HOST}
      - RCON_PORT=${RCON_PORT}
      - RCON_PASSWORD=${RCON_PASSWORD}
      - BALANCER_DAMPENING_THRESHOLD=${BALANCER_DAMPENING_THRESHOLD:-3000}
      - BALANCER_DAMPENING_FACTOR=${BALANCER_DAMPENING_FACTOR:-0.5}
      - BALANCER_NOISE=${BALANCER_NOISE:-150}
    # Port 8000 is now only accessible via 'proxynet' (e.g., from NPM or the frontend)
    # ports:
    #   - "8000:8000"
    networks:
      - proxynet

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BALANCER_PASSWORD=${VITE_BALANCER_PASSWORD}
        - VITE_API_PROXY=${VITE_API_PROXY:-/api}
        - VITE_API_PROXY_HOST=${VITE_API_PROXY_HOST:-http://backend:8000}
    container_name: etl-stats-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8085:80"
    networks:
      - proxynet

networks:
  proxynet:
    external: true
