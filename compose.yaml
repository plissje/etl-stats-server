services:
  backend:
    build:
      context: ./backend
    container_name: etl-stats-backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
    environment:
      - STATS_API_TOKEN=${STATS_API_TOKEN}
      - DATABASE_URL=sqlite:////app/data/etl_stats.db
      - CORS_ORIGINS=*
    # Port 8000 is now only accessible via 'proxynet' (e.g., from NPM or the frontend)
    # ports:
    #   - "8000:8000"
    networks:
      - proxynet

  frontend:
    build:
      context: ./frontend
    container_name: etl-stats-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8085:80"
    networks:
      - proxynet

networks:
  proxynet:
    external: true
